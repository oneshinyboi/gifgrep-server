name: Build and Push Docker Image

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
    - name: Push Docker image
      run: |
        TIMESTAMP=$(date +%s)
        docker build . --file Dockerfile --tag diamondcoder295/giffavs:$TIMESTAMP
        docker tag diamondcoder295/giffavs:$TIMESTAMP diamondcoder295/giffavs:latest
        docker push diamondcoder295/giffavs:$TIMESTAMP
        docker push diamondcoder295/giffavs:latest