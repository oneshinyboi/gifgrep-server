# Example stack for gifdeck-server.
# Set FAV_TOKEN in the stack's "Environment variables" panel (or paste this
# into Portainer -> Stacks -> Web editor). The image is published to Docker
# Hub by the GitHub Action (.github/workflows/docker-image.yml) on release.

services:
  gif-favs:
    image: diamondcoder295/giffavs:latest
    container_name: gif-favs
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      FAV_TOKEN: ${FAV_TOKEN}
      FAV_PORT: "8099"
      FAV_HOST: "0.0.0.0"
      FAV_DB_PATH: /data/favorites.db
    volumes:
      - ./db:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8099/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s